# Staging reverse proxy for the Neuro Art M4 gallery.
# Serves the built client and forwards /api and /sd to the Node proxy.
# Place at /etc/nginx/sites-available/staging.ahg36.com and symlink to sites-enabled.
# TLS: use certbot (Let's Encrypt) for staging.ahg36.com.

server {
    listen 80;
    server_name staging.ahg36.com;
    # certbot will add the 443 server block + redirect.

    # Static client (vite build output copied to this path)
    root /home/admin/web/ahg36.com/m4-gallery/dist;
    index index.html;

    # API proxy + SD bridge -> local Node process (server/proxy.js on :8787)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /sd {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
    location /sd/health {
        proxy_pass http://127.0.0.1:8787;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
